name: API+DB tests and load test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: API + DB tests
        run: pytest
      - name: Smoke load test (15s) with thresholds
        run: |
          python -m app.server ci.db 8000 &
          sleep 2
          locust -f perf/locustfile.py --host http://127.0.0.1:8000 --headless -u 20 -r 10 -t 15s --csv perf/results
          python perf/check_thresholds.py perf/results_stats.csv --p95-ms 500 --max-fail-pct 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-csv
          path: perf/results*.csv
